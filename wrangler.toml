name = "nemesis"
main = ".vercel/output/static/_worker.js/index.js"
compatibility_date = "2024-11-26"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[build]
command = "pnpm run cf:build"

# The output folder is generated by @cloudflare/next-on-pages
[site]
bucket = ".vercel/output/static"

# Enable observability and logs for debugging
[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

