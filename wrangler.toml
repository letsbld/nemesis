name = "nemesis"
main = ".open-next/worker.js"
compatibility_date = "2024-11-26"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[build]
command = "pnpm run cf:build"

# The output folder is generated by @cloudflare/next-on-pages
[site]
bucket = ".open-next/assets"
entry-point = ".open-next/worker"

